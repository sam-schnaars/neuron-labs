<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grokie</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #000000;
        color: #ffffff;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      
      /* Face Container */
      .face-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        width: 100%;
        height: 100%;
      }
      
      .face-wrapper {
        position: relative;
        width: 400px;
        height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .animated-face {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
      }
      
      /* Face parts */
      .face-circle {
        fill: #ffffff;
        transition: transform 0.1s ease-out;
      }
      
      .eye {
        fill: #000000;
        transition: transform 0.15s ease-out;
      }
      
      .eye.speaking {
        animation: blink 0.3s ease-in-out;
      }
      
      .mouth {
        fill: #000000;
        transition: d 0.1s ease-out;
      }
      
      .mouth.speaking {
        animation: mouthMove 0.15s ease-in-out infinite;
      }
      
      @keyframes blink {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
      }
      
      @keyframes mouthMove {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.2); }
      }
      
      /* Bottom Controls */
      .bottom-controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
      }
      
      .toggle-button {
        padding: 12px 24px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 25px;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }
      
      .toggle-button:hover {
        background: rgba(255, 255, 255, 0.3);
        border-color: rgba(255, 255, 255, 0.5);
      }
      
      .toggle-button.active {
        background: rgba(255, 255, 255, 0.4);
        border-color: rgba(255, 255, 255, 0.6);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }
      
      /* Status indicator */
      .status-indicator {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        font-size: 14px;
        color: #ffffff;
        z-index: 1000;
      }
      
      .status-indicator.connected {
        background: rgba(76, 175, 80, 0.3);
      }
      
      .status-indicator.disconnected {
        background: rgba(244, 67, 54, 0.3);
      }
      
      /* Profile Display */
      .profile-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(20px);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 90%;
        z-index: 2000;
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }
      
      .profile-container.visible {
        display: flex;
      }
      
      .profile-image {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid rgba(255, 255, 255, 0.5);
        margin-bottom: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      
      .profile-name {
        font-size: 28px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 10px;
      }
      
      .profile-title {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 12px;
      }
      
      .profile-description {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 12px;
        line-height: 1.4;
        text-align: center;
        max-width: 100%;
      }
      
      .profile-want-to-meet {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.75);
        margin-bottom: 20px;
        font-style: italic;
      }
      
      .profile-linkedin {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        background: rgba(0, 119, 181, 0.2);
        border: 2px solid rgba(0, 119, 181, 0.5);
        border-radius: 25px;
        color: #ffffff;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s;
      }
      
      .profile-linkedin:hover {
        background: rgba(0, 119, 181, 0.4);
        border-color: rgba(0, 119, 181, 0.8);
        transform: scale(1.05);
      }
      
      .profile-linkedin::before {
        content: "🔗";
        font-size: 20px;
      }
      
      /* Attendee list (full list with suggested first) */
      .attendee-list-container {
        position: fixed;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(16px);
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        padding: 16px;
        max-width: 220px;
        max-height: 70vh;
        overflow-y: auto;
        z-index: 1999;
        display: none;
      }
      .attendee-list-container.visible {
        display: block;
      }
      .attendee-list-title {
        font-size: 14px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 12px;
      }
      .attendee-list {
        list-style: none;
      }
      .attendee-list-item {
        padding: 10px 12px;
        margin-bottom: 6px;
        border-radius: 10px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        border: 1px solid transparent;
      }
      .attendee-list-item.suggested {
        background: rgba(76, 175, 80, 0.25);
        border-color: rgba(76, 175, 80, 0.5);
        font-weight: 600;
      }
      .attendee-list-item:not(.suggested):hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .attendee-list-item-badge {
        font-size: 10px;
        color: rgba(76, 175, 80, 0.95);
        margin-left: 6px;
      }
    </style>
  </head>
  <body>
    <div class="face-container">
      <div class="status-indicator" id="statusIndicator">Disconnected</div>
      <div class="face-wrapper">
        <svg class="animated-face" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Face circle -->
          <circle class="face-circle" cx="100" cy="100" r="80" id="faceCircle"/>
          
          <!-- Left eye -->
          <ellipse class="eye" cx="70" cy="80" rx="8" ry="12" id="leftEye"/>
          
          <!-- Right eye -->
          <ellipse class="eye" cx="130" cy="80" rx="8" ry="12" id="rightEye"/>
          
          <!-- Mouth -->
          <ellipse class="mouth" cx="100" cy="130" rx="20" ry="8" id="mouth"/>
        </svg>
      </div>
    </div>
    
    <!-- Profile Display Container -->
    <div class="profile-container" id="profileContainer">
      <img class="profile-image" id="profileImage" src="" alt="Profile" />
      <div class="profile-name" id="profileName"></div>
      <div class="profile-title" id="profileTitle"></div>
      <div class="profile-description" id="profileDescription"></div>
      <div class="profile-want-to-meet" id="profileWantToMeet"></div>
      <a class="profile-linkedin" id="profileLinkedIn" href="#" target="_blank">View LinkedIn Profile</a>
    </div>
    
    <!-- Attendee list (shown with suggested first when user asks who they can meet) -->
    <div class="attendee-list-container" id="attendeeListContainer">
      <div class="attendee-list-title" id="attendeeListTitle">People here</div>
      <ul class="attendee-list" id="attendeeList"></ul>
    </div>
    
    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <button id="toggleGrokieBtn" class="toggle-button">turn grokie </button>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
