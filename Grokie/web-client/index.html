<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grokie</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #000000;
        color: #ffffff;
        overflow: hidden;
      }
      
      /* App Container */
      .app-container {
        display: flex;
        height: 100vh;
        background: #000000;
      }
      
      /* Chat Panel */
      .chat-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #000000;
        overflow: hidden;
      }
      
      .chat-container {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: 100%;
        padding-bottom: 80px;
      }
      
      .chat-container::-webkit-scrollbar {
        width: 8px;
      }
      
      .chat-container::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      
      .chat-container::-webkit-scrollbar-thumb {
        background: #444444;
        border-radius: 4px;
      }
      
      .chat-container::-webkit-scrollbar-thumb:hover {
        background: #555555;
      }
      
      .chat-message {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      
      .chat-message.user {
        flex-direction: row;
      }
      
      .chat-message.assistant {
        flex-direction: row-reverse;
      }
      
      .chat-bubble {
        max-width: 70%;
        padding: 12px 16px;
        border: 1px solid #ffffff;
        border-radius: 12px;
        background: transparent;
      }
      
      .chat-message.user .chat-bubble {
        background: #1a1a1a;
      }
      
      .chat-message.assistant .chat-bubble {
        background: #1a1a1a;
      }
      
      .chat-label {
        font-size: 12px;
        color: #888888;
        font-weight: 600;
        margin-bottom: 4px;
        text-transform: uppercase;
      }
      
      .chat-text {
        color: #ffffff;
        font-size: 15px;
        line-height: 1.5;
        word-wrap: break-word;
      }
      
      .chat-message.interim {
        opacity: 0.6;
        font-style: italic;
      }
      
      /* Bottom Controls */
      .bottom-controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #111111;
        border-top: 1px solid #333333;
        padding: 16px;
        display: flex;
        justify-content: center;
        z-index: 1000;
      }
      
      .toggle-button {
        padding: 12px 24px;
        background: transparent;
        border: 1px solid #ffffff;
        border-radius: 8px;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      
      .toggle-button:hover {
        background: #1a1a1a;
      }
      
      .toggle-button.active {
        background: #667eea;
        border-color: #667eea;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <!-- Chat Panel -->
      <div class="chat-panel">
        <div class="chat-container" id="chatContainer">
          <!-- Chat messages will be inserted here -->
        </div>
      </div>
    </div>
    
    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <button id="toggleGrokieBtn" class="toggle-button">turn grokie off</button>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
